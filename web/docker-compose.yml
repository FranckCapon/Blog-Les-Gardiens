services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gardiens
      POSTGRES_PASSWORD: gardiens
      POSTGRES_DB: gardiens
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gardiens -d gardiens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
